[project]
name = "log2motion"
version = "0.2.0"
description = "Biomechanical motion synthesis from touch logs and Figma prototypes"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = [
    "myosuite==3.0.0",
    "mujoco>=3.6",
    "gymnasium>=1.2.3,<2",
    "numpy>=2.5.4,<3",
    "scipy>=1.18.1,<2",
    "stable-baselines3>=2.9.0,<3",
    "torch>=2.14.1,<3",
    "pillow>=13.0.0,<14",
    "imageio>=2.38.1,<3",
    "imageio-ffmpeg>=0.6.0,<0.7",
    "websockets>=16,<17",
    "reportlab>=5.0.1,<6",
]

[project.optional-dependencies]
android = ["android-env>=1.3.0,<2"]

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "pytest-timeout>=2.4.0,<3", "ruff>=0.17.1,<0.18"]

[tool.uv]
package = false

# Simulation inference needs no CUDA runtime; keep Linux containers small.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 180
markers = ["integration: real policy, renderer, or subprocess integration tests"]

[tool.ruff]
target-version = "py312"
exclude = [".upstream", "environment/scene", "integration/figma-plugin"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
